name: WeaveStudio CI

on:
  push:
    branches: [main, master, hardening/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weavestudio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: |
            release/VERIFICATION.json
            release/weavestudio-acquisition-package/PACKAGE_MANIFEST.json
