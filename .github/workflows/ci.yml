name: WeaveStudio Canonical Production Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weavestudio-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.61.0
          npx playwright install chromium
      - name: Exercise merged provenance workflow on canonical production
        env:
          BASE_URL: https://weavestudio-nine.vercel.app
        run: |
          cat > weavestudio-production-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const browserErrors = [];
          page.on('console', m => { if (m.type() === 'error') browserErrors.push(`console:${m.text()}`); });
          page.on('pageerror', e => browserErrors.push(`pageerror:${e.message}`));
          const pass = label => console.log(`PASS ${label}`);
          const visible = async (locator, label) => {
            await locator.waitFor({ state: 'visible', timeout: 20000 });
            pass(label);
          };

          try {
            const response = await page.goto(`${base}/`, { waitUntil: 'networkidle', timeout: 30000 });
            if (!response || response.status() !== 200) throw new Error(`Landing HTTP status ${response?.status()}`);
            if (page.url() !== `${base}/`) throw new Error(`Canonical URL mismatch: ${page.url()}`);
            if (!(await page.title()).includes('WeaveStudio')) throw new Error(`Unexpected title: ${await page.title()}`);
            await visible(page.getByRole('button', { name: 'Open guided demo' }), 'canonical landing renders');
            await visible(page.getByRole('button', { name: 'Start with a template' }), 'landing controls render');

            await page.getByTestId('open-guided-demo').click();
            await visible(page.getByRole('heading', { name: 'Source material' }), 'guided demo opens');
            await page.getByTestId('workflow-canvas').waitFor({ state: 'attached', timeout: 20000 });
            pass('workflow canvas attached');

            const source = page.getByLabel('Source material');
            await source.evaluate(element => {
              element.focus();
              element.setSelectionRange(0, Math.min(32, element.value.length));
              element.dispatchEvent(new Event('select', { bubbles: true }));
            });
            const addFragment = page.getByRole('button', { name: 'Add source fragment' });
            if (!(await addFragment.isEnabled())) throw new Error('Add source fragment stayed disabled after source selection');
            await addFragment.click();
            await visible(page.getByRole('status').filter({ hasText: /source fragment added for provenance/i }), 'source fragment captured');

            await page.getByRole('button', { name: /workflow outline/i }).click();
            let outline = page.getByRole('region', { name: /workflow outline/i });
            await outline.getByRole('button', { name: /proposed approach/i }).click();
            await page.getByLabel('Content').fill('A traceable pilot recommendation based on the selected source evidence.');

            await page.getByRole('button', { name: /workflow outline/i }).click();
            outline = page.getByRole('region', { name: /workflow outline/i });
            await outline.getByRole('button', { name: /assumption check/i }).click();
            await page.getByRole('button', { name: 'Approve', exact: true }).click();
            pass('human review approval applied');

            await page.getByRole('button', { name: 'Validate' }).click();
            const validator = page.getByRole('dialog', { name: 'Workflow Validator' });
            await visible(validator.getByText('Ready', { exact: true }).first(), 'validator reports Ready after approval');
            await page.getByRole('button', { name: 'Close Workflow Validator' }).click();

            await page.getByRole('button', { name: 'Generate' }).click();
            const preview = page.getByRole('dialog', { name: 'Output preview' });
            await visible(preview, 'output preview opens');
            await preview.getByRole('button', { name: 'Provenance' }).click();
            await visible(preview.getByText('Workspace lineage only — this does not verify the truth or authenticity of the source.'), 'provenance trust-boundary disclosure');
            await visible(preview.getByRole('heading', { name: 'Annotate a claim' }), 'claim annotation surface');

            await preview.getByLabel('Claim candidate').selectOption({ index: 1 });
            await preview.getByRole('checkbox', { name: /source fragment/i }).first().check();
            await preview.getByLabel('Derivation').selectOption('direct');
            await preview.getByRole('button', { name: 'Save provenance' }).click();
            await visible(preview.getByText('Valid', { exact: true }).first(), 'saved claim-to-source provenance resolves Valid');
            await visible(preview.getByText(/source range/i).first(), 'source range is inspectable');

            await page.screenshot({ path: 'weavestudio-production-provenance.png', fullPage: true });
            pass('production provenance screenshot captured');

            await page.waitForTimeout(2000);
            const entries = await page.evaluate(() => Object.keys(localStorage).map(key => [key, localStorage.getItem(key)]));
            console.log(`LOCAL_STORAGE_KEYS=${entries.map(([key]) => key).join(',')}`);
            const serialized = JSON.stringify(entries);
            if (!serialized.includes('"provenance"') || !serialized.includes('"claims"')) {
              throw new Error(`Persisted workspace did not expose provenance graph; keys=${entries.map(([key]) => key).join(',')}`);
            }
            pass('provenance graph persisted in browser-local workspace state');

            if (browserErrors.length) throw new Error(`Browser errors: ${JSON.stringify(browserErrors)}`);
            pass('no browser console/page errors');
            console.log('PRODUCTION_SMOKE_PASS');
          } finally {
            await browser.close();
          }
          EOF
          node weavestudio-production-smoke.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weavestudio-production-smoke-evidence
          path: weavestudio-production-provenance.png
          if-no-files-found: ignore
